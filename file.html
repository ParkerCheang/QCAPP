<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>軍棋對決</title>
<style>
  :root {
    --bg: #101722;
    --panel: #192433;
    --panel2: #202e3e;
    --gold: #d9bd7f;
    --text: #efe6d2;
    --muted: #9eabba;
    --red: #c94e45;
    --blue: #6090bb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    background: radial-gradient(ellipse at 50% 25%, #29384b, #111a25 65%, #0b1118);
    font-family: "Microsoft JhengHei", "Noto Serif TC", serif;
  }

  .app { max-width: 1120px; margin: auto; padding: 24px; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }

  .brand { display: flex; align-items: center; gap: 13px; }

  .logo {
    width: 46px; height: 46px;
    display: grid; place-items: center;
    border: 1px solid #9e8251; border-radius: 13px;
    color: var(--gold); font-size: 25px;
    background: linear-gradient(145deg, #303c49, #18212c);
  }

  h1 { margin: 0; font-size: 25px; letter-spacing: 4px; }
  .subtitle { margin-top: 4px; color: var(--muted); font: 12px sans-serif; letter-spacing: 1px; }

  button {
    border: 1px solid #4a5b70; border-radius: 8px;
    padding: 10px 14px; color: var(--text);
    background: #263649; font: inherit; cursor: pointer;
    transition: .18s ease;
  }
  button:hover { border-color: var(--gold); background: #32465c; }
  button.primary {
    color: #211b10; border: 0; font-weight: 700;
    background: linear-gradient(135deg, #e9d39e, #bc995a);
  }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 275px; gap: 18px; }

  .board-panel, .side-panel {
    border: 1px solid #39495c; border-radius: 16px;
    background: linear-gradient(145deg, #1d2b3b, #151f2b);
    box-shadow: 0 18px 45px #0005;
  }
  .board-panel { padding: 18px; }

  .statusbar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; padding: 0 2px 14px;
    color: var(--muted); font: 13px sans-serif;
  }

  .turn { color: var(--text); display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); }
  .dot.ai { background: var(--blue); }

  .board {
    display: grid;
    grid-template-columns: repeat(5, minmax(48px, 1fr));
    grid-template-rows: repeat(12, minmax(45px, 1fr));
    gap: 5px;
    padding: 12px;
    border: 1px solid #a18454; border-radius: 11px;
    background:
      linear-gradient(145deg, #765b3c, #4b3928);
    box-shadow: inset 0 0 30px #17100a88;
  }

  .cell {
    min-width: 0; min-height: 45px;
    display: grid; place-items: center;
    position: relative;
    border: 1px solid #c5a97866; border-radius: 6px;
    background: linear-gradient(145deg, #d0b78b, #b99c6a);
    box-shadow: inset 0 1px 3px #fff4, 0 2px 3px #24190f55;
    cursor: pointer;
    user-select: none;
  }

  .cell:nth-child(5n+3) { background: linear-gradient(145deg, #c8ad7c, #b29665); }
  .cell:hover { outline: 2px solid #f4dfad; outline-offset: -2px; }
  .cell.selected { outline: 3px solid #fff0ac; outline-offset: -3px; }
  .cell.legal { box-shadow: inset 0 0 0 3px #85ce9a, 0 2px 3px #24190f55; }
  .cell.attack { box-shadow: inset 0 0 0 3px #e96f64, 0 2px 3px #24190f55; }

  .piece {
    width: 83%; height: 83%; max-width: 66px; max-height: 54px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    border-radius: 7px;
    font-weight: 800; line-height: 1.15;
    box-shadow: 0 2px 5px #20170e66, inset 0 1px 2px #fff7;
    letter-spacing: 1px;
  }

  .piece.red {
    color: #7e211e; border: 1px solid #f1b3a1;
    background: linear-gradient(145deg, #ffe2c8, #e8a18b);
  }
  .piece.blue {
    color: #173c5b; border: 1px solid #bbd5e5;
    background: linear-gradient(145deg, #e3f0ee, #91bed0);
  }
  .piece.hidden {
    color: #ead7ad; border: 1px solid #d2b46f;
    background: repeating-linear-gradient(135deg, #34495c, #34495c 6px, #293c4e 6px, #293c4e 12px);
    font-size: 19px;
  }
  .rank { font-size: clamp(11px, 2vw, 15px); }
  .team { margin-top: 2px; font: 9px sans-serif; opacity: .75; }

  .side-panel { padding: 19px; }
  .side-panel h2 { margin: 0 0 14px; font-size: 17px; letter-spacing: 2px; }
  .info-card {
    padding: 13px; margin-bottom: 12px;
    border: 1px solid #35465a; border-radius: 10px;
    background: #111a24aa;
  }
  .label { color: var(--muted); font: 11px sans-serif; letter-spacing: 1px; }
  .value { margin-top: 7px; font-size: 15px; }
  .controls { display: grid; gap: 9px; margin-top: 14px; }
  .controls button { width: 100%; }
  .log {
    height: 210px; overflow: auto;
    color: #c4ced8; font: 12px/1.7 sans-serif;
  }
  .log div { padding: 5px 0; border-bottom: 1px solid #ffffff0d; }
  .rules { margin: 13px 2px 0; color: var(--muted); font: 12px/1.7 sans-serif; }

  @media (max-width: 780px) {
    .app { padding: 12px; }
    .layout { grid-template-columns: 1fr; }
    .side-panel { order: 2; }
    .board-panel { padding: 10px; }
    .board { gap: 3px; padding: 7px; grid-template-rows: repeat(12, minmax(36px, 1fr)); }
    .cell { min-height: 36px; }
    .piece { width: 92%; height: 90%; }
    header { align-items: flex-start; }
    h1 { font-size: 21px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">棋</div>
      <div>
        <h1>軍棋對決</h1>
        <div class="subtitle">單機策略 · 挑戰 AI</div>
      </div>
    </div>
    <button class="primary" id="newGameTop">新開一局</button>
  </header>

  <main class="layout">
    <section class="board-panel">
      <div class="statusbar">
        <div class="turn"><span class="dot" id="turnDot"></span><span id="turnText">你的回合</span></div>
        <div id="message">點擊棋子，再點擊目標格</div>
      </div>
      <div class="board" id="board" aria-label="軍棋棋盤"></div>
    </section>

    <aside class="side-panel">
      <h2>戰局資訊</h2>
      <div class="info-card">
        <div class="label">目前對手</div>
        <div class="value">藍軍 AI・標準難度</div>
      </div>
      <div class="info-card">
        <div class="label">剩餘棋子</div>
        <div class="value">紅方 <span id="redCount">20</span>　／　藍方 <span id="blueCount">20</span></div>
      </div>
      <div class="info-card">
        <div class="label">戰況紀錄</div>
        <div class="log" id="log"></div>
      </div>
      <div class="controls">
        <button id="newGame">重新開始</button>
      </div>
      <p class="rules">
        簡化規則：棋子每次移動一格；司令至工兵依軍階大小決勝。
        工兵可排除地雷，炸彈與任何棋子同歸於盡；軍旗被吃即判負。
        地雷、炸彈、軍旗不能移動。
      </p>
    </aside>
  </main>
</div>

<script>
(() => {
  const rows = 12, cols = 5;
  const boardEl = document.getElementById("board");
  const logEl = document.getElementById("log");
  const messageEl = document.getElementById("message");
  const turnText = document.getElementById("turnText");
  const turnDot = document.getElementById("turnDot");

  // 數字越大軍階越高；地雷、炸彈、軍旗另外處理
  const army = [
    ["司令", 12], ["軍長", 11],
    ["師長", 10], ["師長", 10],
    ["旅長", 9], ["旅長", 9],
    ["團長", 8], ["團長", 8],
    ["營長", 7], ["營長", 7],
    ["連長", 6], ["連長", 6],
    ["排長", 5], ["排長", 5],
    ["工兵", 4], ["工兵", 4], ["工兵", 4],
    ["地雷", 0], ["地雷", 0],
    ["炸彈", -1], ["軍旗", -2]
  ];

  let cells = [];
  let selected = null;
  let legal = [];
  let turn = "red";
  let gameOver = false;
  let aiTimer = null;

  function makeArmy(side) {
    const shuffled = army.map(p => ({ name: p[0], rank: p[1], side, revealed: side === "red", alive: true }));
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
  }

  function addLog(text) {
    const line = document.createElement("div");
    line.textContent = text;
    logEl.prepend(line);
  }

  function startGame() {
    clearTimeout(aiTimer);
    cells = Array.from({ length: rows }, () => Array(cols).fill(null));
    selected = null;
    legal = [];
    turn = "red";
    gameOver = false;
    logEl.innerHTML = "";
    messageEl.textContent = "點擊棋子，再點擊目標格";

    const redPieces = makeArmy("red");
    const bluePieces = makeArmy("blue");

    // 雙方各自佈陣於棋盤兩端的四排
    let i = 0;
    for (let r = 8; r < 12; r++)
      for (let c = 0; c < cols; c++)
        cells[r][c] = redPieces[i++];

    i = 0;
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < cols; c++)
        cells[r][c] = bluePieces[i++];

    addLog("新戰局開始，你執紅方先行。");
    render();
  }

  function render() {
    boardEl.innerHTML = "";
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        if (selected && selected.r === r && selected.c === c) cell.classList.add("selected");
        if (legal.some(p => p.r === r && p.c === c)) {
          cell.classList.add(cells[r][c] ? "attack" : "legal");
        }
        const piece = cells[r][c];
        if (piece) {
          const token = document.createElement("div");
          const hidden = piece.side === "blue" && !piece.revealed;
          token.className = `piece ${piece.side} ${hidden ? "hidden" : ""}`;
          if (hidden) {
            token.innerHTML = '<span>軍</span><span class="team">未知</span>';
          } else {
            token.innerHTML = \`<span class="rank">\${piece.name}</span><span class="team">\${piece.side === "red" ? "紅軍" : "藍軍"}</span>\`;
          }
          cell.appendChild(token);
        }
        cell.addEventListener("click", () => onCellClick(r, c));
        boardEl.appendChild(cell);
      }
    }

    const redCount = cells.flat().filter(p => p && p.side === "red").length;
    const blueCount = cells.flat().filter(p => p && p.side === "blue").length;
    document.getElementById("redCount").textContent = redCount;
    document.getElementById("blueCount").textContent = blueCount;

    const isAI = turn === "blue";
    turnText.textContent = gameOver ? "本局結束" : isAI ? "AI 回合" : "你的回合";
    turnDot.className = isAI ? "dot ai" : "dot";
  }

  function movable(piece) {
    return piece && piece.rank > 0;
  }

  function getMoves(r, c) {
    const piece = cells[r][c];
    if (!movable(piece)) return [];
    const moves = [];
    for (const [dr, dc] of [[1,0], [-1,0], [0,1], [0,-1]]) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
      const target = cells[nr][nc];
      if (!target || target.side !== piece.side) moves.push({ r: nr, c: nc });
    }
    return moves;
  }

  function onCellClick(r, c) {
    if (gameOver || turn !== "red") return;
    const piece = cells[r][c];

    if (selected && legal.some(p => p.r === r && p.c === c)) {
      doMove(selected.r, selected.c, r, c);
      return;
    }

    if (piece && piece.side === "red") {
      selected = { r, c };
      legal = getMoves(r, c);
      messageEl.textContent = movable(piece) ? "選擇一格移動" : "地雷、炸彈和軍旗不能移動";
      render();
    } else {
      selected = null;
      legal = [];
      render();
    }
  }

  function doMove(r, c, nr, nc) {
    const attacker = cells[r][c];
    const defender = cells[nr][nc];

    if (defender && defender.side === "blue" && !defender.revealed) {
      defender.revealed = true;
      addLog(`翻開敵方棋子：${defender.name}。`);
    }

    cells[r][c] = null;

    if (!defender) {
      cells[nr][nc] = attacker;
      addLog(`${attacker.side === "red" ? "紅方" : "藍方"}${attacker.name}移動。`);
    } else {
      const result = battle(attacker, defender);
      addLog(result.text);

      if (result.attackerSurvives) cells[nr][nc] = attacker;
      else cells[nr][nc] = null;

      if (defender.name === "軍旗") {
        endGame(attacker.side, `${attacker.side === "red" ? "紅方" : "藍方"}奪得軍旗，獲得勝利！`);
      }
    }

    selected = null;
    legal = [];

    if (!gameOver) {
      turn = turn === "red" ? "blue" : "red";
      render();
      if (turn === "blue") aiTimer = setTimeout(aiMove, 650);
    } else {
      render();
    }
  }

  function battle(a, d) {
    if (a.name === "炸彈" || d.name === "炸彈") {
      return { attackerSurvives: false, text: `${a.name}與${d.name}同歸於盡。` };
    }

    if (d.name === "地雷") {
      if (a.name === "工兵") {
        return { attackerSurvives: true, text: `工兵排除地雷，成功前進！` };
      }
      return { attackerSurvives: false, text: `${a.name}被地雷炸毀。` };
    }

    if (d.name === "軍旗") {
      return { attackerSurvives: true, text: `${a.side === "red" ? "紅方" : "藍方"}吃掉軍旗！` };
    }

    if (a.rank > d.rank) {
      return { attackerSurvives: true, text: `${a.name}擊敗${d.name}。` };
    }
    if (a.rank < d.rank) {
      return { attackerSurvives: false, text: `${a.name}被${d.name}擊敗。` };
    }
    return { attackerSurvives: false, text: `${a.name}與${d.name}同歸於盡。` };
  }

  function aiMove() {
    if (gameOver) return;

    const options = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const p = cells[r][c];
        if (!p || p.side !== "blue") continue;
        for (const m of getMoves(r, c)) {
          const target = cells[m.r][m.c];
          let score = Math.random() * 4;

          if (target) {
            score += 5;
            if (target.side === "red") {
              if (target.name === "軍旗") score += 1000;
              else if (p.name === "炸彈") score += 10;
              else if (p.name === "工兵" && target.name === "地雷") score += 12;
              else if (p.rank > target.rank) score += 12 + (p.rank - target.rank);
              else if (p.rank < target.rank && p.name !== "炸彈") score -= 15;
            }
          } else {
            // 鼓勵 AI 往玩家陣地推進
            score += (m.r - r) * 0.4;
          }
          options.push({ r, c, nr: m.r, nc: m.c, score });
        }
      }
    }

    if (!options.length) {
      endGame("red", "藍方已無法行棋，你獲得勝利！");
      render();
      return;
    }

    options.sort((a, b) => b.score - a.score);
    const choice = options[0];
    messageEl.textContent = "AI 正在思考…";
    doMove(choice.r, choice.c, choice.nr, choice.nc);
  }

  function endGame(winner, text) {
    gameOver = true;
    messageEl.textContent = text;
    addLog(text);
  }

  document.getElementById("newGame").addEventListener("click", startGame);
  document.getElementById("newGameTop").addEventListener("click", startGame);

  startGame();
})();
</script>
</body>
</html>
